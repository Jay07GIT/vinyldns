# This is the main frontend configuration file for the application.
# It is used to configure the frontend application and its dependencies.
LDAP {
  # For OpenLDAP, this would be a full DN to the admin for LDAP / user that can see all users
  user = "cn=admin,dc=planetexpress,dc=com"

  # Password for the admin account
  password = "GoodNewsEveryone"

  # Keep this as an empty string for OpenLDAP
  domain = ""

  # This will be the name of the LDAP field that carries the user's login id (what they enter in the username in login form)
  userNameAttribute = "uid"

  # For organization, leave empty for this demo, the domainName is what matters, and that is the LDAP structure
  # to search for users that require login
  searchBase = [
    {organization = "", domainName = "ou=people,dc=planetexpress,dc=com"},
  ]
  context {
    initialContextFactory = "com.sun.jndi.ldap.LdapCtxFactory"
    initialContextFactory = ${?LDAP_INITIAL_CONTEXT_CLASS}
    securityAuthentication = "simple"
    securityAuthentication = ${?LDAP_SECURITY_AUTH}

    # Note: The following assumes a purely docker setup, using container_name = vinyldns-ldap
    providerUrl = "ldap://localhost:19004"
    providerUrl = ${?LDAP_PROVIDER_URL}
  }

  # This is only needed if keeping vinyldns user store in sync with ldap (to auto lock out users who left your
  # company for example)
  user-sync {
    enabled = false
    enabled = ${?USER_SYNC_ENABLED}
    hours-polling-interval = 1
     hours-polling-interval = ${?USER_SYNC_POLL_INTERVAL}
  }
}

user-sync {
  # Provider for user sync: "ldap", "graph-api", or "none"
  # When "none", falls back to LDAP.user-sync.enabled for backward compatibility
  provider = "none"
  provider = ${?USER_SYNC_PROVIDER}

  polling-interval-hours = 24
  polling-interval-hours = ${?USER_SYNC_POLLING_INTERVAL}

  # When true, logs which users would be locked without actually locking them
  dry-run = false
  dry-run = ${?USER_SYNC_DRY_RUN}

  graph-api {
    # Microsoft Graph API OAuth2 token endpoint (same tenant as OIDC)
    # Defaults to the value set in oidc.token-endpoint
    username-attribute = "onPremisesSamAccountName"
    username-attribute = ${?GRAPH_API_USERNAME_ATTRIBUTE}
    scope = "https://graph.microsoft.com/.default"
    scope = ${?GRAPH_API_SCOPE}
    users-endpoint = "https://graph.microsoft.com/v1.0"
    users-endpoint = ${?GRAPH_API_USERS_ENDPOINT}
  }
}

mysql {
  class-name = "vinyldns.mysql.repository.MySqlDataStoreProvider"
  endpoint = "localhost:19002"
  endpoint = ${?MYSQL_ENDPOINT}

  settings {
    # JDBC Settings, these are all values in scalikejdbc-config, not our own
    # these must be overridden to use MYSQL for production use
    # assumes a docker or mysql instance running locally
    name = "vinyldns"
    name = ${?DATABASE_NAME}
    driver = "org.mariadb.jdbc.Driver"
    driver = ${?JDBC_DRIVER}
    migration-url = "jdbc:mariadb://"${mysql.endpoint}"/?user=root&password=pass&socketTimeout=20000&useMysqlMetadata=true"
    migration-url = ${?JDBC_MIGRATION_URL}
    url = "jdbc:mariadb://"${mysql.endpoint}"/vinyldns?user=root&password=pass&socketTimeout=20000&useMysqlMetadata=true"
    url = ${?JDBC_URL}
    user = "root"
    user = ${?JDBC_USER}
    password = "pass"
    password = ${?JDBC_PASSWORD}
    flyway-out-of-order = false
    flyway-out-of-order = ${?FLYWAY_OUT_OF_ORDER}
    flyway-ignore-missing-migrations = false
    flyway-ignore-missing-migrations = ${?FLYWAY_IGNORE_MISSING_MIGRATIONS}

    max-lifetime = 300000
    connection-timeout-millis = 30000
    idle-timeout = 150000
    maximum-pool-size = 20
    minimum-idle = 5
  }

  repositories {
    user {}
    user-change {}
    task {}
  }
}

# Note: This MUST match the API or strange errors will ensue, NoOpCrypto should not be used for production
crypto {
  type = "vinyldns.core.crypto.NoOpCrypto"
  type = ${?CRYPTO_TYPE}
  secret = ${?CRYPTO_SECRET}
}

api {
  limits {
    batchchange-routing-max-items-limit = 100
    membership-routing-default-max-items = 100
    membership-routing-max-items-limit = 1000
    membership-routing-max-groups-list-limit = 3000
    recordset-routing-default-max-items= 100
    zone-routing-default-max-items = 100
    zone-routing-max-items-limit = 100
  }
}

# Batch change limit
batch-change-limit = 1000

http.port = 9002
http.port = ${?PORTAL_PORT}

portal.vinyldns.backend.url = "http://localhost:9000"
portal.vinyldns.backend.url = ${?VINYLDNS_BACKEND_URL}

portal.vinyldns.url = "http://localhost:9002"
portal.vinyldns.url = ${?VINYLDNS_PORTAL_URL}

old-portal {
  url = "http://localhost:9001"
  url = ${?OLD_PORTAL_URL}
}

portal.test_login = true
portal.test_login = ${?TEST_LOGIN}

data-stores = ["mysql"]

# Must be true to manage shared zones through the portal
shared-display-enabled = true
shared-display-enabled = ${?SHARED_ZONES_ENABLED}

# Only check CSRF on form-encoded/multipart/plain-text POSTs; JSON requests are
# protected by the browser's same-origin policy so they don't need a CSRF token.
play.filters.csrf.contentType.blackList = ["application/x-www-form-urlencoded", "multipart/form-data", "text/plain"]

play.http.parser.maxMemoryBuffer = 370K
play.i18n.langs = ["en"]

play.http.session.maxAge = 10h
play.http.session.maxAge = ${?SESSION_MAX_AGE}
play.http.session.secure = false
play.http.session.secure = ${?SESSION_SECURE}
play.http.session.httpOnly = true
play.http.session.httpOnly = ${?SESSION_HTTP_ONLY}

# You generate this yourself following https://www.playframework.com/documentation/2.7.x/ApplicationSecret
play.http.secret.key = "changeme"
play.http.secret.key = ${?PLAY_HTTP_SECRET_KEY}

# See https://www.playframework.com/documentation/2.8.x/AllowedHostsFilter for more details.
# Note: allowed = ["."] matches all hosts hence would not be recommended in a production environment.
play.filters.hosts {
  allowed = ["."]
}

# ---------------------------------------------------------------------------
# Logging (log4j2)
# ---------------------------------------------------------------------------
# Base configuration is in conf/log4j2.xml.
# Override individual logger levels here using Play-style keys.
# Valid levels: OFF FATAL ERROR WARN INFO DEBUG TRACE ALL
# ---------------------------------------------------------------------------
logger.root        = INFO
logger.play        = WARN
logger.application = DEBUG
logger.com.zaxxer.hikari = ERROR

# ---------------------------------------------------------------------------
# Module registration, version, UI content
# ---------------------------------------------------------------------------
play.modules.enabled += "modules.VinylDNSModule"

vinyldns.base-version = "unset"
vinyldns.version = ${vinyldns.base-version}
vinyldns.version = ${?VINYLDNS_VERSION}

links = [
  {
    displayOnSidebar = true
    displayOnLoginScreen = true
    title = "API Documentation"
    href = "http://vinyldns.io"
    icon = "fa fa-file-text-o"
  }
]

dns-change-notices = [
  {
    status = "Complete"
    alertType = "info"
    text = "Your changes are fully implemented. Keep in mind it may take a few hours for the changes to fully propogate out."
  },
  {
    status = "PendingReview"
    alertType = "info"
    text = "Your DNS Change requires further review. It will be approved and processed following the review."
    hrefText = "See the docs for more information."
    href = "https://www.vinyldns.io/portal/manual-review-scheduling"
  },
  {
    status = "Scheduled"
    alertType = "info"
    text = "If there are any changes in your scheduled DNS Change with a status of Needs Review they will be addressed prior to the scheduled date and time."
  }
]

# You can provide configuration overrides via local.conf if you don't want to replace everything in
# this configuration file
include "local.conf"

